        // "Biology" -> "department", "Biology, Chemistry" -> "departments"
        function departmentWord(category) {
            const count = String(category || '').split(',').map(c => c.trim()).filter(Boolean).length;
            return count > 1 ? 'departments' : 'department';
        }

        function createColorIcon(color, category, easelId) {
            // Matches the map marker/tooltip pill style: the easel ID sits
            // inside the colored circle rather than as a separate dot+text.
            // The color still doubles as category shorthand - on mobile the
            // "Poster Category" text column is hidden to save space, so
            // color would otherwise be the ONLY way that info is conveyed
            // (fails WCAG 1.4.1 Use of Color, and screen readers get nothing
            // at all). The aria-label keeps category available everywhere.
            const bgColor = color || '#404040';
            const textColor = (window.layout && typeof window.layout.getTextColorForBackground === 'function')
                ? window.layout.getTextColorForBackground(bgColor)
                : 'white';
            const text = (easelId || '').toString();
            const fontSize = text.length <= 2 ? 13 : text.length <= 4 ? 11 : text.length <= 6 ? 10 : 9;
            const label = category
                ? `${text ? text + ', ' : ''}${category} ${departmentWord(category)}`
                : (text || 'Department color indicator');
            const safeLabel = escapeAttr(label);
            const safeText = escapeAttr(text);
            return `<span class="easel-pill easel-pill--table" role="img" aria-label="${safeLabel}">
                        <svg class="easel-pill__svg" viewBox="0 0 36 36" role="presentation" focusable="false">
                            <circle cx="18" cy="18" r="16" fill="${bgColor}" stroke="white" stroke-width="2"></circle>
                            <text x="18" y="18" fill="${textColor}" font-size="${fontSize}" dominant-baseline="middle" text-anchor="middle">${safeText}</text>
                        </svg>
                    </span>`;
        }

        // Global variables for marker management
        let markerObjs = [];
        let allMarkers = [];
        let globalDeselectionHandlersRegistered = false;

        const AUTO_HIGHLIGHT_DELAY_MS = 350;
        let autoHighlightTimeout = null;
        let selectedCategories = new Set();

        function clearTableSelection() {
            const hasSelection = $('#tsvTable tbody tr.selected').length > 0;

            $('#tsvTable tbody tr').removeClass('selected');
            removeMarkerHighlights();
            restoreMarkerOpacity();

            if (window.posterMap) {
                if (typeof window.posterMap.hideInfo === 'function') {
                    window.posterMap.hideInfo();
                }
                if (window.posterMap.infoPanel) {
                    window.posterMap.infoPanel.classList.remove('active');
                }
            }

            return hasSelection;
        }

        function registerGlobalDeselectionHandlers() {
            if (globalDeselectionHandlersRegistered) {
                return;
            }
            globalDeselectionHandlersRegistered = true;

            const handleOutsideInteraction = event => {
                if (!$('#tsvTable tbody tr.selected').length) {
                    return;
                }

                const target = event.target;
                if ($(target).closest('#tsvTable tbody tr').length) {
                    return;
                }
                if ($(target).closest('[data-side], .color-marker').length) {
                    return;
                }
                if ($(target).closest('.info-panel').length) {
                    return;
                }

                clearTableSelection();
            };

            if (window.PointerEvent) {
                document.addEventListener('pointerdown', handleOutsideInteraction, { passive: true });
            } else {
                let touchTriggered = false;

                document.addEventListener('touchstart', event => {
                    touchTriggered = true;
                    handleOutsideInteraction(event);
                }, { passive: true });

                document.addEventListener('mousedown', event => {
                    if (touchTriggered) {
                        touchTriggered = false;
                        return;
                    }
                    handleOutsideInteraction(event);
                });
            }
        }

        function computeMarkerCoordinates(markerGroup, markerCircle) {
            if (!markerGroup || !markerCircle) {
                return null;
            }

            let translateX = 0;
            let translateY = 0;
            const transformAttr = markerGroup.getAttribute('transform') || '';
            const translateMatch = transformAttr.match(/translate\(\s*([\-\d.]+)(?:[\s,]+([\-\d.]+))?/i);

            if (translateMatch) {
                translateX = parseFloat(translateMatch[1]) || 0;
                translateY = translateMatch[2] !== undefined ? parseFloat(translateMatch[2]) || 0 : 0;
            }

            const rawCx = markerCircle.cx && markerCircle.cx.baseVal ? markerCircle.cx.baseVal.value : parseFloat(markerCircle.getAttribute('cx'));
            const rawCy = markerCircle.cy && markerCircle.cy.baseVal ? markerCircle.cy.baseVal.value : parseFloat(markerCircle.getAttribute('cy'));

            const cx = Number.isFinite(rawCx) ? rawCx : 0;
            const cy = Number.isFinite(rawCy) ? rawCy : 0;

            return {
                x: translateX + cx,
                y: translateY + cy
            };
        }

        // Columns that carry mount/marker data rather than poster info to show in the table
        const HIDDEN_TABLE_COLUMNS = new Set(['Mount ID', 'Side', 'X Coordinate', 'Y Coordinate', 'Orientation', 'Color']);

        function displayTable(tableData) {
            const table = document.getElementById("tsvTable");
            table.innerHTML = "";

            // Generate headers (excluding mount/marker columns)
            const headers = tableData[0];
            let headerRow = '<thead><tr>' + headers.map(header => {
                if (HIDDEN_TABLE_COLUMNS.has(header)) {
                    return '';
                }

                const isPrimary = header === 'Easel Board' || header === 'Poster Title' || header === 'Students' || header === 'Poster Time';
                const classes = [];

                if (header === 'Poster Title') {
                    classes.push('poster-title');
                }
                if (header === 'Easel Board') {
                    classes.push('easel-column');
                }
                if (header === 'Poster Time') {
                    classes.push('poster-time-column');
                }
                if (header === 'Students') {
                    classes.push('student-column');
                }
                if (header === 'Faculty') {
                    classes.push('faculty-column');
                }
                if (header === 'Poster Category') {
                    classes.push('category-column');
                }
                if (!isPrimary) {
                    classes.push('responsive-hidden');
                }

                const displayHeader = header === 'Easel Board' ? 'Easel' : 
                                    header === 'Poster Category' ? 'Department' : header;

                return `<th${classes.length ? ` class=\"${classes.join(' ')}\"` : ''}>${displayHeader}</th>`;
            }).join('') + '</tr></thead>';
            table.innerHTML += headerRow;


            // Sort by Easel Board column before rendering (ascending)
            const headerLabels = headers;
            const bodyRows = tableData.slice(1).sort((a, b) => {
                const aVal = (a[1] || '').toString();
                const bVal = (b[1] || '').toString();
                return aVal.localeCompare(bVal, undefined, { numeric: true, sensitivity: 'base' });
            });

            const colorColumnIndex = headerLabels.indexOf('Color');
            const categoryColumnIndex = headerLabels.indexOf('Poster Category');

            let bodyMarkup = '<tbody>' + bodyRows.map(row => {
                const easelBoard = row[1];
                const posterTitle = row[2];
                const posterColor = colorColumnIndex !== -1 ? row[colorColumnIndex] : '';
                const posterCategory = categoryColumnIndex !== -1 ? (row[categoryColumnIndex] || '') : '';
                const rowLabel = `View poster ${easelBoard}: ${posterTitle}`;
                let rowHtml = `
                    <tr data-easel="${easelBoard}" data-title="${posterTitle}" data-category="${escapeAttr(posterCategory)}" tabindex="0" role="button" aria-label="${escapeAttr(rowLabel)}">`;

                row.forEach((cell, index) => {
                    const headerName = headerLabels[index];
                    if (HIDDEN_TABLE_COLUMNS.has(headerName)) {
                        return;
                    }

                    const isPrimary = headerName === 'Easel Board' || headerName === 'Poster Title' || headerName === 'Students' || headerName === 'Poster Time';
                    const cellClasses = [];

                    if (headerName === 'Poster Title') {
                        cellClasses.push('poster-title');
                    }
                    if (headerName === 'Easel Board') {
                        cellClasses.push('easel-column');
                    }
                    if (headerName === 'Poster Time') {
                        cellClasses.push('poster-time-column');
                    }
                    if (headerName === 'Students') {
                        cellClasses.push('student-column');
                    }
                    if (headerName === 'Faculty') {
                        cellClasses.push('faculty-column');
                    }
                    if (headerName === 'Poster Category') {
                        cellClasses.push('category-column');
                    }
                    if (!isPrimary) {
                        cellClasses.push('responsive-hidden');
                    }

                    if (headerName === 'Easel Board') {
                        const colorIcon = createColorIcon(posterColor, posterCategory, easelBoard);
                        const classes = ['easel-cell'].concat(cellClasses).join(' ').trim();
                        rowHtml += `<td class="${classes}">${colorIcon}</td>`;
                    } else {
                        rowHtml += `<td${cellClasses.length ? ` class="${cellClasses.join(' ')}"` : ''}>${cell}</td>`;
                    }
                });

                rowHtml += '</tr>';
                return rowHtml;
            }).join('') + '</tbody>';

            table.innerHTML += bodyMarkup;

            // Add table event listeners
            addTableEventListeners();
        }

        function addTableEventListeners() {
            // Add click listeners to table rows for marker highlighting
            $('#tsvTable tbody tr').on('click', function(e) {
                // Step 1: Click row → get easelBoard from row data
                const easelBoard = $(this).data('easel');
                const isCurrentlySelected = $(this).hasClass('selected');
                if (easelBoard) {
                    if (isCurrentlySelected) {
                        // Step 6: Toggle row → remove selected on the table row
                        clearTableSelection();
                    } else {
                        // Step 2: Find marker → search allMarkers for matching easelBoardId
                        applyRowSelection(this);
                    }
                } else {
                }
            });

            // Rows are made keyboard-operable (tabindex="0" role="button") so
            // keyboard-only users can select a poster, not just mouse/touch users.
            $('#tsvTable tbody tr').on('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    $(this).trigger('click');
                }
            });

            // Clear selection when clicking empty space anywhere else on the page/map
            $('#posterMap').on('click', function(e) {
                if ($(e.target).closest('[data-side], .color-marker').length) {
                    return;
                }

                clearTableSelection();
            });

            registerGlobalDeselectionHandlers();
        }

        function applyRowSelection(rowElement, options = {}) {
            const { scrollIntoView = false } = options;
            const row = rowElement instanceof HTMLElement ? rowElement : rowElement?.[0];

            if (!row) {
                return null;
            }

            const $row = $(row);
            const easelBoard = $row.data('easel');
            if (!easelBoard) {
                return null;
            }

            if (window.posterMap && typeof window.posterMap.hideInfo === 'function') {
                window.posterMap.hideInfo();
            }

            // Mobile only (bottom-sheet.js no-ops elsewhere): drop the sheet
            // to Half so the marker this selection is about to pan/zoom to
            // isn't left hidden under a Full sheet. Dispatched synchronously
            // and before the camera call below, so by the time setView()
            // runs, PosterSessionMap's viewport insets already reflect the
            // Half sheet height.
            document.dispatchEvent(new CustomEvent('poster-row-selected', { bubbles: true }));

            const highlightedMarker = highlightMarkerByEasel(easelBoard, { deferTooltip: true });

            fadeOtherMarkers(highlightedMarker);

            const triggerTooltip = () => {
                if (!highlightedMarker || !highlightedMarker.circle) {
                    return;
                }
                const mouseEnterEvent = new MouseEvent('mouseenter', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                highlightedMarker.circle.dispatchEvent(mouseEnterEvent);
            };

            if (highlightedMarker) {
                if (!highlightedMarker.coordinates) {
                    highlightedMarker.coordinates = computeMarkerCoordinates(highlightedMarker.marker, highlightedMarker.circle);
                }

                if (highlightedMarker.coordinates && window.posterMap && typeof window.posterMap.setView === 'function') {
                    // Pan-only fly-to (zoom unchanged) - shares the same
                    // eased engine/curve as reset and the zoom buttons per
                    // the zoom-easing PRD, instead of a bespoke pan-only
                    // animation.
                    window.posterMap.setView(
                        {
                            scale: window.posterMap.currentZoom,
                            x: highlightedMarker.coordinates.x,
                            y: highlightedMarker.coordinates.y
                        },
                        {
                            animate: true,
                            onComplete: triggerTooltip
                        }
                    );
                } else {
                    triggerTooltip();
                }
            }

            $row.addClass('selected');
            $('#tsvTable tbody tr').not($row).removeClass('selected');

            if (scrollIntoView && typeof row.scrollIntoView === 'function') {
                row.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }

            return highlightedMarker;
        }

        // Marker management functions
        // Sibling marker fading helpers
        function clearSiblingFade() {
            document.querySelectorAll('.marker-sibling-faded').forEach(element => {
                element.classList.remove('marker-sibling-faded');
            });
        }

        function applySiblingFade(markerData) {
            clearSiblingFade();
            if (!markerData || !markerData.partnerCircles || markerData.partnerCircles.length === 0) {
                return;
            }
            markerData.partnerCircles.forEach(circle => {
                if (circle?.classList) {
                    circle.classList.add('marker-sibling-faded');
                }
            });
        }

        function highlightMarkerByEasel(easelBoard, options = {}) {
            const { deferTooltip = false } = options;
            removeMarkerHighlights();
            clearSiblingFade();
            
            let targetMarkerData = null;
            
            allMarkers.forEach((markerData, index) => {
                if (markerData.easelBoardId === easelBoard) {
                    targetMarkerData = markerData;
                }
            });
            
            if (!targetMarkerData) {
                return null;
            }
            
            const markerGroup = targetMarkerData.marker;
            const markerCircle = targetMarkerData.circle || markerGroup;

            if (!markerGroup || !markerCircle) {
                console.error(`ERROR: Marker element missing for easel: ${easelBoard}`);
                return null;
            }

            if (!targetMarkerData.coordinates) {
                targetMarkerData.coordinates = computeMarkerCoordinates(markerGroup, markerCircle);
            }

            markerGroup.classList.remove('marker-faded');
            markerGroup.querySelectorAll('circle').forEach(circle => {
                circle.classList.remove('marker-focused');
            });
            
            markerCircle.classList.add('marker-highlight');
            markerCircle.classList.add('marker-focused');
            if (!deferTooltip) {
                const mouseEnterEvent = new MouseEvent('mouseenter', {
                    view: window,
                    bubbles: true,
                    cancelable: true
                });
                markerCircle.dispatchEvent(mouseEnterEvent);
            }
            
            applySiblingFade(targetMarkerData);
            window.currentHighlightedMarker = targetMarkerData;
            return targetMarkerData;
        }

        // Remove all marker highlights
        function removeMarkerHighlights() {
            document.querySelectorAll('.marker-highlight').forEach(element => {
                element.classList.remove('marker-highlight');
                element.classList.remove('marker-focused');
            });
            clearSiblingFade();
            window.currentHighlightedMarker = null;
        }
        
        // Fade other markers when one is selected
        function fadeOtherMarkers(selectedMarker) {
            if (!selectedMarker) {
                restoreMarkerOpacity();
                return;
            }

            const selectedMountId = selectedMarker?.mountId || null;

            const processedGroups = new Set();
            let fadedCount = 0;

            allMarkers.forEach((markerData, index) => {
                const markerGroup = markerData.marker;
                const markerCircle = markerData.circle || markerGroup;

                if (!markerGroup) {
                    return;
                }

                if (markerData.mountId === selectedMountId) {
                    markerGroup.classList.remove('marker-faded');
                    if (markerCircle) {
                        markerCircle.classList.remove('marker-faded');
                    }
                    return;
                }

                if (!processedGroups.has(markerGroup)) {
                    markerGroup.classList.add('marker-faded');
                    processedGroups.add(markerGroup);
                    fadedCount++;
                }

                if (markerCircle) {
                    markerCircle.classList.remove('marker-focused');
                }
            });

            applySiblingFade(selectedMarker);

        }
        
        // Restore all marker opacity
        function restoreMarkerOpacity() {
            const processedGroups = new Set();

            allMarkers.forEach(markerData => {
                const markerGroup = markerData.marker;
                const markerCircle = markerData.circle || markerGroup;

                if (markerGroup && !processedGroups.has(markerGroup)) {
                    markerGroup.classList.remove('marker-faded');
                    processedGroups.add(markerGroup);
                }

                if (markerCircle) {
                    markerCircle.classList.remove('marker-focused');
                    markerCircle.classList.remove('marker-highlight');
                }
            });
            clearSiblingFade();
        }

        // Fade out all markers except the hovered one (for hover effects)
        function fadeOtherMarkersOnHover(hoveredMarker) {
            document.body.classList.add('marker-hover-active');
            clearSiblingFade();

            let fadedCount = 0;
            let focusedCount = 0;

            allMarkers.forEach(markerData => {
                const markerGroup = markerData.marker;
                const markerCircle = markerData.circle || markerGroup;

                if (!markerGroup) {
                    return;
                }

                const isHovered = hoveredMarker && (markerData === hoveredMarker || markerGroup === hoveredMarker || markerCircle === hoveredMarker);

                if (isHovered) {
                    markerGroup.classList.remove('marker-faded');
                    if (markerCircle) {
                        markerCircle.classList.add('marker-focused');
                    }
                    applySiblingFade(markerData);
                    focusedCount++;
                } else {
                    markerGroup.classList.add('marker-faded');
                    if (markerCircle) {
                        markerCircle.classList.remove('marker-focused');
                    }
                    fadedCount++;
                }
            });

        }


        // Enhanced search + category filtering
        function rowMatchesCategoryFilter(row) {
            if (selectedCategories.size === 0) return true;

            const rawCategory = row.getAttribute('data-category') || '';
            const rowCategories = rawCategory.split(',').map(c => c.trim()).filter(Boolean);

            return rowCategories.some(cat => selectedCategories.has(cat));
        }

        function applyFilters() {
            const searchInput = document.getElementById('searchbar');
            const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
            const table = document.getElementById('tsvTable');
            const rows = table.querySelectorAll('tbody tr');

            const visibleEasels = new Set();
            const visibleRows = [];

            rows.forEach(row => {
                const matchesText = searchTerm === '' || row.textContent.toLowerCase().includes(searchTerm);
                const matchesCategory = rowMatchesCategoryFilter(row);
                const isVisible = matchesText && matchesCategory;

                if (isVisible) {
                    row.style.display = '';
                    row.classList.remove('marker-faded');
                    const easel = row.getAttribute('data-easel');
                    if (easel) visibleEasels.add(easel);
                    visibleRows.push(row);
                } else {
                    row.style.display = 'none';
                    row.classList.add('marker-faded');
                }
            });

            // Update marker visibility based on active filters
            updateMarkerVisibility(visibleEasels);

            const hasActiveFilter = searchTerm !== '' || selectedCategories.size > 0;

            if (!hasActiveFilter) {
                restoreMarkerOpacity();
                cancelPendingAutoHighlight();
                return;
            }

            scheduleAutoHighlight(visibleRows, searchTerm, searchInput);
        }

        function populateCategoryOptions(tableData) {
            const chipRow = document.getElementById('categoryChipRow');
            if (!chipRow) return;

            const headers = tableData[0] || [];
            const categoryIndex = headers.indexOf('Poster Category');

            const categories = new Set();
            if (categoryIndex !== -1) {
                for (let i = 1; i < tableData.length; i++) {
                    const raw = tableData[i][categoryIndex] || '';
                    raw.split(',').forEach(part => {
                        const trimmed = part.trim();
                        if (trimmed) categories.add(trimmed);
                    });
                }
            }

            const sortedCategories = [...categories].sort((a, b) => a.localeCompare(b));

            if (sortedCategories.length === 0) {
                chipRow.innerHTML = '';
                return;
            }

            // One toggle chip per department - the sole filter UI on both
            // desktop and mobile (replaced the old funnel-button dropdown).
            // selectedCategories is the single source of truth; chips just
            // render it (see updateCategoryFilterUI).
            chipRow.innerHTML = sortedCategories.map(category => {
                const safeLabel = escapeAttr(category);
                return `<button type="button" class="category-chip" data-category="${safeLabel}" aria-pressed="false">${category}</button>`;
            }).join('');

            chipRow.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', function() {
                    const value = this.dataset.category;
                    if (selectedCategories.has(value)) {
                        selectedCategories.delete(value);
                    } else {
                        selectedCategories.add(value);
                    }
                    updateCategoryFilterUI();
                    applyFilters();
                });
            });
        }

        function updateCategoryFilterUI() {
            document.querySelectorAll('#categoryChipRow .category-chip').forEach(chip => {
                chip.setAttribute('aria-pressed', String(selectedCategories.has(chip.dataset.category)));
            });
        }


        function initializeInfoButton() {
            const toggleBtn = document.getElementById('infoButtonToggle');
            const popover = document.getElementById('infoPopover');

            if (!toggleBtn || !popover) return;

            const closePopover = () => {
                if (popover.hidden) return;
                popover.hidden = true;
                toggleBtn.setAttribute('aria-expanded', 'false');
            };

            // The popover lives at the end of <body> now (see where it's
            // declared), not nested in .header, so it needs its position
            // computed from the button's live rect instead of CSS anchoring.
            const positionPopover = () => {
                const btnRect = toggleBtn.getBoundingClientRect();
                popover.style.right = (window.innerWidth - btnRect.right) + 'px';

                // On mobile the button now lives in the sheet's search row
                // near the bottom of the screen (see bottom-sheet.js's
                // relocateInfoButton), not just the header, so "always open
                // below" can push the popover off-screen. Measure its
                // natural height (invisible, so there's no flash in the
                // wrong spot) and flip to open above the button when there
                // isn't enough room below.
                popover.style.visibility = 'hidden';
                popover.hidden = false;
                const popoverHeight = popover.getBoundingClientRect().height;
                popover.hidden = true;
                popover.style.visibility = '';

                const spaceBelow = window.innerHeight - btnRect.bottom - 8;
                const opensAbove = spaceBelow < popoverHeight && btnRect.top - 8 >= popoverHeight;
                popover.style.top = opensAbove
                    ? (btnRect.top - popoverHeight - 8) + 'px'
                    : (btnRect.bottom + 8) + 'px';
            };

            toggleBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                const isOpen = !popover.hidden;
                if (isOpen) {
                    closePopover();
                } else {
                    positionPopover();
                    popover.hidden = false;
                    toggleBtn.setAttribute('aria-expanded', 'true');
                }
            });

            popover.addEventListener('click', function(e) {
                e.stopPropagation();
            });

            document.addEventListener('click', closePopover);

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && !popover.hidden) {
                    closePopover();
                    toggleBtn.focus();
                }
            });
        }

        function initializeSearch() {
            const searchInput = document.getElementById('searchbar');
            if (!searchInput) return;

            const clearButton = document.getElementById('clearSearch');
            const clearBottomContainer = document.getElementById('clearSearchBottomContainer');
            const clearBottomButton = document.getElementById('clearSearchBottom');

            // Mobile only (bottom-sheet.js no-ops elsewhere): focusing the
            // search field expands the sheet to Full so the keyboard has
            // room to work instead of fighting a half-open sheet.
            searchInput.addEventListener('focus', function() {
                document.dispatchEvent(new CustomEvent('poster-search-focused', { bubbles: true }));
            });

            searchInput.addEventListener('input', function() {
                applyFilters();

                const hasSearch = this.value.length > 0;

                if (clearButton) {
                    clearButton.style.display = hasSearch ? 'inline-flex' : 'none';
                }

                // Redundant "Clear search results" button below the last row -
                // the X inside the search bar is small and easy to miss,
                // especially on mobile.
                if (clearBottomContainer) {
                    clearBottomContainer.hidden = !hasSearch;
                }
            });

            // Also handle keyup for immediate response
            searchInput.addEventListener('keyup', function() {
                this.dispatchEvent(new Event('input'));
            });

            // Handle clear button
            if (clearButton) {
                clearButton.addEventListener('click', function() {
                    resetSearch();
                });
            }

            if (clearBottomButton) {
                clearBottomButton.addEventListener('click', function() {
                    resetSearch();
                    searchInput.focus();
                });
            }
        }

        function cancelPendingAutoHighlight() {
            if (autoHighlightTimeout) {
                clearTimeout(autoHighlightTimeout);
                autoHighlightTimeout = null;
            }
        }

        function scheduleAutoHighlight(visibleRows, searchTerm, searchInput) {
            cancelPendingAutoHighlight();

            if (!visibleRows || visibleRows.length !== 1) {
                return;
            }

            const targetRow = visibleRows[0];
            if (!targetRow || targetRow.classList.contains('selected')) {
                return;
            }

            autoHighlightTimeout = setTimeout(() => {
                const currentInput = searchInput.value.toLowerCase().trim();
                if (currentInput !== searchTerm) {
                    return;
                }

                if (targetRow.style.display === 'none') {
                    return;
                }

                applyRowSelection(targetRow, { scrollIntoView: true });
                autoHighlightTimeout = null;
            }, AUTO_HIGHLIGHT_DELAY_MS);
        }

        function updateMarkerVisibility(visibleEasels) {
            const mountStates = new Map();

            allMarkers.forEach(markerData => {
                const markerGroup = markerData.marker;
                if (!markerGroup) {
                    return;
                }

                const shouldShowCircle = visibleEasels.has(markerData.easelBoardId);
                const state = mountStates.get(markerGroup) || { showGroup: false, circles: [] };

                if (shouldShowCircle) {
                    state.showGroup = true;
                }

                state.circles.push({
                    circle: markerData.circle,
                    text: markerData.text,
                    shouldShow: shouldShowCircle
                });

                mountStates.set(markerGroup, state);
            });

            mountStates.forEach((state, markerGroup) => {
                if (!markerGroup) {
                    return;
                }

                if (state.showGroup) {
                    markerGroup.style.display = '';
                    markerGroup.classList.remove('marker-hidden');
                } else {
                    markerGroup.style.display = 'none';
                    markerGroup.classList.add('marker-hidden');
                }

                state.circles.forEach(({ circle, text, shouldShow }) => {
                    if (circle) {
                        circle.style.display = shouldShow ? '' : 'none';
                        circle.classList.toggle('marker-hidden', !shouldShow);
                    }

                    if (text) {
                        text.style.display = shouldShow ? '' : 'none';
                        text.classList.toggle('marker-hidden', !shouldShow);
                    }
                });
            });
        }
        
        // Function to reset search completely
        function resetSearch() {
            const searchInput = document.getElementById('searchbar');
            if (searchInput) {
                cancelPendingAutoHighlight();
                searchInput.value = '';
                searchInput.dispatchEvent(new Event('input'));
            }
        }

        function loadTableData() {
            fetch('data/poster-data.tsv')
                .then(response => response.text())
                .then(data => {
                    const tableData = LayoutAPI.prototype.parseTsvText(data);

                    console.log('=== TABLE DATA DEBUG ===');
                    console.log('Table data loaded:', tableData.length, 'rows');
                    console.log('Headers:', tableData[0]);

                    // Check easel board IDs in the table data
                    const easelBoardColumnIndex = tableData[0].indexOf('Easel Board');
                    if (easelBoardColumnIndex !== -1) {
                        const easelBoardIds = [];
                        for (let i = 1; i < tableData.length; i++) {
                            if (tableData[i][easelBoardColumnIndex]) {
                                easelBoardIds.push(tableData[i][easelBoardColumnIndex]);
                            }
                        }
                    // Compare with registered markers
                    if (allMarkers.length > 0) {
                        const tableEaselIds = new Set(easelBoardIds);
                        const markerEaselIds = new Set(allMarkers.map(m => m.easelBoardId));
                        
                        const missingInMarkers = [...tableEaselIds].filter(id => !markerEaselIds.has(id));
                        const missingInTable = [...markerEaselIds].filter(id => !tableEaselIds.has(id));
                        
                    }
                    }
                    
                    displayTable(tableData);
                    populateCategoryOptions(tableData);
                    initializeSearch();
                })
                .catch(error => {
                    console.error('Error loading table data:', error);
                });
        }

        // Layout API Usage
        function initializeLayout() {
            // Wait for both posterMap instance and PosterSessionMap class
            if (!window.posterMap || !window.PosterSessionMap || !window.LayoutAPI) {
                setTimeout(initializeLayout, 100);
                return;
            }
            
            // Ensure the Layout API method is available
            if (!window.posterMap.initializeLayoutAPI) {
                window.PosterSessionMap.prototype.initializeLayoutAPI = function() {
                    this.layout = new LayoutAPI(this);
                    return this.layout;
                };
            }
            
            // Initialize the layout API
            const layout = window.posterMap.initializeLayoutAPI();
            
            // Add the full site map as a single pre-rendered SVG (replaces the
            // separate Parsons/Sprague/Strauss Plaza/Jacobs-Keck pieces). This SVG
            // carries its own colors, so no style.fill override is applied.
            // Placed at its native size/position for a first look; not yet
            // fine-tuned against the mount coordinate system.
            layout.addSVG({
                id: 'strauss-plaza-map',
                svgFile: 'assets/svg/strauss-plaza.svg',
                position: { x: 0, y: 0 },
                interactive: false
            });

                // Load poster data from the combined poster-data.tsv (poster info,
                // mount position/orientation, and marker color all in one file)
                layout.loadPostersFromDataTSV('data/poster-data.tsv');

                // Register markers for table interaction
                function rebuildMarkerRegistry(contextLabel = 'initial') {
                    console.log(`=== MARKER REGISTRATION (${contextLabel}) ===`);
                    if (!window.layout || !window.layout.layoutElements || window.layout.layoutElements.size === 0) {
                        console.log('Layout elements unavailable; skipping marker registration');
                        return false;
                    }

                    const nextMarkers = [];

                    window.layout.layoutElements.forEach((element, id) => {
                        if (!element.element) {
                            return;
                        }

                        if (element.type === 'poster-mount') {
                            const markerGroup = element.element;

                            if (element.sideA?.easelBoard && element.sideA.easelBoard !== 'Unassigned') {
                                const sideACircle = markerGroup.querySelector('circle[data-side="A"][data-easel]') || markerGroup.querySelector('circle[data-side="A"]');
                                const sideAText = markerGroup.querySelector('text[data-side="A"]');
                                if (sideACircle) {
                                    nextMarkers.push({
                                        marker: markerGroup,
                                        circle: sideACircle,
                                        text: sideAText,
                                        easelBoardId: element.sideA.easelBoard,
                                        mountId: id,
                                        side: 'A',
                                        coordinates: computeMarkerCoordinates(markerGroup, sideACircle)
                                    });
                                }
                            }

                            if (element.sideB?.easelBoard && element.sideB.easelBoard !== 'Unassigned') {
                                const sideBCircle = markerGroup.querySelector('circle[data-side="B"][data-easel]') || markerGroup.querySelector('circle[data-side="B"]');
                                const sideBText = markerGroup.querySelector('text[data-side="B"]');
                                if (sideBCircle) {
                                    nextMarkers.push({
                                        marker: markerGroup,
                                        circle: sideBCircle,
                                        text: sideBText,
                                        easelBoardId: element.sideB.easelBoard,
                                        mountId: id,
                                        side: 'B',
                                        coordinates: computeMarkerCoordinates(markerGroup, sideBCircle)
                                    });
                                }
                            }

                        } else if (element.type === 'lone-marker') {
                            if (element.poster?.easelBoard) {
                                const markerGroup = element.element;
                                const loneCircle = markerGroup.querySelector('circle[data-easel]') || markerGroup.querySelector('circle');
                                if (loneCircle) {
                                    nextMarkers.push({
                                        marker: markerGroup,
                                        circle: loneCircle,
                                        easelBoardId: element.poster.easelBoard,
                                        mountId: id,
                                        side: null,
                                        coordinates: computeMarkerCoordinates(markerGroup, loneCircle)
                                    });
                                }
                            }

                        }

                    });

                    allMarkers = nextMarkers;

                    const mountGroups = new Map();
                    allMarkers.forEach(markerObj => {
                        if (!markerObj.partnerCircles) {
                            markerObj.partnerCircles = [];
                        } else {
                            markerObj.partnerCircles.length = 0;
                        }
                        if (!markerObj.mountId) {
                            return;
                        }
                        if (!mountGroups.has(markerObj.mountId)) {
                            mountGroups.set(markerObj.mountId, []);
                        }
                        mountGroups.get(markerObj.mountId).push(markerObj);
                    });

                    mountGroups.forEach(group => {
                        if (group.length > 1) {
                            group.forEach(markerObj => {
                                markerObj.partnerCircles = group
                                    .filter(partner => partner !== markerObj)
                                    .map(partner => partner.circle);
                            });
                        }
                    });

                    console.log(`Registered ${allMarkers.length} markers for table interaction`);
                    if (allMarkers.length > 0) {
                        console.log('Sample marker data:', allMarkers[0]);
                        console.log('All easel board IDs:', allMarkers.map(m => m.easelBoardId));
                    }

                    return allMarkers.length > 0;
                }

                rebuildMarkerRegistry('initial');

                // The map starts hidden behind a loading overlay so the jump
                // from the full zoomed-out canvas to the fitted default zoom
                // (see fitToContent) happens off-screen instead of as a visible
                // jerk. This reveals it once the fitted view is ready - with a
                // hard fallback so the overlay can never get stuck covering
                // (and blocking clicks/taps on) the map if fitting fails.
                let contentFitted = false;
                let mapRevealed = false;

                function revealMap() {
                    if (mapRevealed) {
                        return;
                    }
                    mapRevealed = true;
                    const overlay = document.getElementById('mapLoadingOverlay');
                    if (overlay) {
                        overlay.classList.add('map-loading-overlay--hidden');
                    }
                }

                // Zoom limits (min = fit-whole-map, max = label reaches
                // ~40px) depend on the map's rendered content and container
                // size, so they're computed fresh right before fitToContent
                // uses them - otherwise fitToContent would clamp against the
                // constructor's placeholder minZoom/maxZoom instead of the
                // real ones for this layout.
                function refitMapView() {
                    if (!window.posterMap) {
                        return false;
                    }
                    if (typeof window.posterMap.recalculateZoomLimits === 'function') {
                        window.posterMap.recalculateZoomLimits();
                    }
                    if (typeof window.posterMap.fitToContent === 'function') {
                        return window.posterMap.fitToContent();
                    }
                    return false;
                }

                contentFitted = refitMapView();
                if (contentFitted) {
                    revealMap();
                }

                // Try to register markers again after a delay in case the layout is still loading
                setTimeout(() => {
                    if (!rebuildMarkerRegistry('delayed')) {
                        console.log('Layout elements still not available after delay');
                    }

                    // Only (re)fit if the earlier attempt didn't find content yet -
                    // avoids yanking the view out from under a user who's already
                    // panned/zoomed on their own.
                    if (!contentFitted) {
                        contentFitted = refitMapView();
                    }
                    revealMap();
                }, 2000);

                // Belt-and-suspenders: never leave the map hidden/unclickable
                // indefinitely even if the above somehow never fires.
                setTimeout(revealMap, 4000);

                // Make layout API available globally for easy testing
                window.layout = layout;
        }
        
        // Prevent zoom out beyond initial scale for map SVG only
        function preventMapZoomOut() {
            const svgMap = document.querySelector('.svg-map');
            if (!svgMap) return;
            
            const initialScale = 1.0;
            const currentZoom = window.outerWidth / window.innerWidth;
            
            if (currentZoom < initialScale) {
                // Reset map SVG to minimum scale if zoomed out too far
                svgMap.style.transform = `scale(${initialScale})`;
            }
        }
        
        // Monitor zoom changes for map only
        window.addEventListener('resize', preventMapZoomOut);
        window.addEventListener('orientationchange', preventMapZoomOut);

        // Zoom limits (min = fit-whole-map, max = label reaches ~40px)
        // depend on the map container's current rendered size, so they need
        // recomputing when that size changes. Debounced since resize fires
        // rapidly; deliberately does NOT re-run fitToContent - that would
        // yank the view back to default out from under a user who's already
        // panned/zoomed on their own (fullscreen toggle is handled
        // separately, synchronously, in toggleFullScreen itself since it
        // doesn't fire a window resize event).
        let zoomLimitsResizeTimer = null;
        function scheduleZoomLimitsRecalc() {
            if (zoomLimitsResizeTimer) {
                clearTimeout(zoomLimitsResizeTimer);
            }
            zoomLimitsResizeTimer = setTimeout(() => {
                zoomLimitsResizeTimer = null;
                if (window.posterMap && typeof window.posterMap.recalculateZoomLimits === 'function') {
                    window.posterMap.recalculateZoomLimits();
                }
            }, 150);
        }
        window.addEventListener('resize', scheduleZoomLimitsRecalc);
        window.addEventListener('orientationchange', scheduleZoomLimitsRecalc);

        // Start initialization when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            console.log('made by jon ebueng from CIS :)');
            initializeLayout();
            loadTableData();
            initializeInfoButton();
            preventMapZoomOut(); // Initial check
        });
    </script>
